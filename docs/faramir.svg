<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Faramir, Captain of Gondor, under the White Tree and the seven stars">
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#1c2b45"/>
      <stop offset="0.6" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#070b14"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a2a"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4a3a"/>
      <stop offset="1" stop-color="#1b241c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eef5"/>
      <stop offset="1" stop-color="#8ea0b4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- sky and distant Minas Tirith -->
  <rect width="900" height="520" fill="url(#sky)"/>
  <g fill="#f3f6ff" filter="url(#glow)">
    <circle cx="300" cy="86" r="2.4"/><circle cx="352" cy="62" r="3"/><circle cx="410" cy="48" r="2.4"/>
    <circle cx="470" cy="44" r="3.2"/><circle cx="530" cy="50" r="2.4"/><circle cx="586" cy="64" r="3"/>
    <circle cx="636" cy="88" r="2.4"/>
  </g>
  <g fill="#8fa3bd" fill-opacity="0.45">
    <circle cx="150" cy="140" r="1.3"/><circle cx="210" cy="60" r="1.1"/><circle cx="700" cy="130" r="1.3"/>
    <circle cx="790" cy="70" r="1.1"/><circle cx="840" cy="170" r="1.4"/><circle cx="90" cy="220" r="1.2"/>
    <circle cx="760" cy="40" r="1"/><circle cx="60" cy="90" r="1.3"/>
  </g>
  <!-- the white city, in haze -->
  <g fill="#2a3a55" fill-opacity="0.9" filter="url(#haze)">
    <path d="M520 330 L560 330 L560 250 L600 250 L600 300 L640 300 L640 230 L700 230 L700 290 L760 290 L760 330 L900 330 L900 360 L520 360 Z"/>
  </g>
  <g fill="#34486a" fill-opacity="0.7">
    <path d="M600 300 L600 262 L612 262 L612 240 L628 240 L628 262 L640 262 L640 300 Z"/>
    <path d="M660 290 L660 236 L672 236 L672 222 L688 222 L688 236 L700 236 L700 290 Z"/>
    <rect x="706" y="268" width="50" height="26"/>
    <rect x="770" y="300" width="130" height="34"/>
  </g>

  <!-- White Tree emblem, large, behind the ranger -->
  <g transform="translate(450 262)" filter="url(#glow)" fill="none" stroke="#dfe7f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M0 150 C 0 90, 0 40, 0 -40"/>
    <path d="M0 40 C -40 20, -70 -10, -84 -60"/>
    <path d="M0 40 C 40 20, 70 -10, 84 -60"/>
    <path d="M0 0 C -30 -14, -52 -40, -58 -84"/>
    <path d="M0 0 C 30 -14, 52 -40, 58 -84"/>
    <path d="M0 -40 C -16 -56, -26 -80, -24 -108"/>
    <path d="M0 -40 C 16 -56, 26 -80, 24 -108"/>
    <path d="M-84 -60 C -92 -70, -94 -82, -88 -92"/>
    <path d="M84 -60 C 92 -70, 94 -82, 88 -92"/>
    <path d="M-58 -84 C -62 -94, -60 -104, -52 -110"/>
    <path d="M58 -84 C 62 -94, 60 -104, 52 -110"/>
    <path d="M-24 -108 C -24 -118, -18 -126, -8 -130"/>
    <path d="M24 -108 C 24 -118, 18 -126, 8 -130"/>
    <!-- crown above the tree -->
    <path d="M-34 -150 L-24 -168 L-12 -152 L0 -176 L12 -152 L24 -168 L34 -150 Z" stroke-width="3.5"/>
  </g>

  <!-- ground -->
  <path d="M0 400 C 150 380, 300 395, 450 392 C 600 389, 760 372, 900 390 L900 520 L0 520 Z" fill="url(#ground)"/>

  <!-- the ranger: hooded, cloaked, sword at rest -->
  <g transform="translate(300 400)">
    <!-- cloak -->
    <path d="M0 0 C -70 -30, -64 -160, -40 -230 C -28 -262, 28 -262, 40 -230 C 64 -160, 70 -30, 0 0 Z" fill="url(#cloak)"/>
    <!-- inner shadow fold -->
    <path d="M-6 -10 C -34 -60, -30 -150, -14 -220 C -10 -236, 8 -236, 12 -220 C 26 -150, 30 -60, 4 -10 Z" fill="#141b15" fill-opacity="0.7"/>
    <!-- hood -->
    <path d="M-40 -230 C -44 -268, -30 -294, 0 -300 C 30 -294, 44 -268, 40 -230 C 28 -240, -28 -240, -40 -230 Z" fill="#2c3a2c"/>
    <path d="M-20 -236 C -18 -262, -8 -276, 0 -280 C 8 -276, 18 -262, 20 -236 C 10 -246, -10 -246, -20 -236 Z" fill="#0a0d0a"/>
    <!-- face in shadow, a hint of light -->
    <path d="M-6 -258 C -2 -262, 4 -262, 8 -256 C 6 -250, 0 -248, -4 -250 Z" fill="#b89a7a" fill-opacity="0.55"/>
    <!-- arm and sword -->
    <path d="M30 -150 C 46 -130, 54 -100, 52 -60 L 40 -62 C 42 -100, 34 -124, 22 -144 Z" fill="#2c3a2c"/>
    <path d="M46 -64 L 60 -60 L 58 -48 L 44 -52 Z" fill="#6b5330"/>
    <path d="M52 -62 L 86 -30 L 90 -22 L 56 -54 Z" fill="url(#steel)"/>
    <path d="M58 -56 L 72 -42" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2"/>
    <!-- quiver and bow on the back -->
    <path d="M-44 -200 C -60 -150, -58 -90, -40 -40" fill="none" stroke="#5a4630" stroke-width="4" stroke-linecap="round"/>
    <path d="M-44 -200 L -40 -40" stroke="#c9b8a0" stroke-width="1"/>
    <path d="M-30 -210 L -22 -236 M-26 -212 L -14 -232 M-34 -208 L -30 -238" stroke="#3b2f1e" stroke-width="3" stroke-linecap="round"/>
    <!-- ground shadow -->
    <ellipse cx="0" cy="4" rx="78" ry="10" fill="#000" fill-opacity="0.45"/>
  </g>

  <!-- title -->
  <text x="450" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="12" fill="#e9eef5">FARAMIR</text>
  <text x="450" y="498" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" letter-spacing="2" fill="#8fa3bd">The younger brother, wiser and swifter... and alive.</text>
</svg>
