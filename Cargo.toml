[package]
name = "faramir"
version = "0.3.0"
edition = "2021"
authors = ["Alejandro Gamboa", "jupyterj0nes"]
description = "DFIR persistence hunting for Windows and Linux from disk images, triage packages and offline filesystems"

[dependencies]
clap = { version = "4", features = ["derive"] }
nt_hive2 = "4"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
anyhow = "1"
blockcarve = "0.1.2"
roxmltree = "0.20"
indicatif = "0.17"
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
ewf = "0.4"
ntfs = "0.4"
mbrman = "0.6"
vshadow = "0.2"
ext4-view = { version = "1", features = ["std"] }
lvm2 = "0.0.3"
rust-fs-xfs = { version = "0.14", default-features = false }
rust-fs-core = { version = "0.3", default-features = false }

